<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KL Vibe Check — Dining & Cafe Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .pin-grid { column-count: 1; column-gap: 1.25rem; }
        @media (min-width: 640px) { .pin-grid { column-count: 2; } }
        @media (min-width: 1024px) { .pin-grid { column-count: 3; } }
        @media (min-width: 1280px) { .pin-grid { column-count: 4; } }
        .pin-card { break-inside: avoid; margin-bottom: 1.25rem; }
        #mapContainer { height: 420px; width: 100%; border-radius: 1.5rem; }
        .hub-card.active-hub { border: 2px solid #F43F5E !important; transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-extrabold tracking-tight">KL Vibe Check</h1>
            <button onclick="toggleMapView()" id="mapToggleBtn" class="bg-rose-500 text-white px-4 py-2 rounded-full text-xs font-bold">Map View</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">
        <!-- FIXED LEVEL 1 HUBS -->
        <section>
            <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
                <button onclick="selectHub('speakeasy')" id="hub-speakeasy" class="hub-card bg-slate-900 text-white p-4 rounded-2xl text-xs font-bold hover:bg-rose-500 transition">🍸 Speakeasy</button>
                <button onclick="selectHub('rooftop')" id="hub-rooftop" class="hub-card bg-slate-900 text-white p-4 rounded-2xl text-xs font-bold hover:bg-rose-500 transition">🌆 Rooftop</button>
                <button onclick="selectHub('outdoor-nature')" id="hub-outdoor-nature" class="hub-card bg-slate-900 text-white p-4 rounded-2xl text-xs font-bold hover:bg-rose-500 transition">🌿 Nature</button>
                <button onclick="selectHub('street-night')" id="hub-street-night" class="hub-card bg-slate-900 text-white p-4 rounded-2xl text-xs font-bold hover:bg-rose-500 transition">🌙 Street</button>
                <button onclick="selectHub('party')" id="hub-party" class="hub-card bg-slate-900 text-white p-4 rounded-2xl text-xs font-bold hover:bg-rose-500 transition">🎉 Party</button>
                <button onclick="selectHub('all')" class="bg-slate-200 text-slate-700 p-4 rounded-2xl text-xs font-bold hover:bg-slate-300 transition">↺ All</button>
            </div>
        </section>

        <!-- FLUID LEVEL 2 TAGS -->
        <section id="level2Section" class="hidden bg-white p-4 rounded-2xl border border-slate-100 flex items-center justify-between gap-4 shadow-sm">
            <span id="activeHubLabel" class="text-xs font-bold text-slate-500 uppercase">Sub-filters:</span>
            <div id="dynamicTags" class="flex flex-wrap items-center gap-2"></div>
        </section>

        <section id="mapSection" class="hidden"><div id="mapContainer"></div></section>

        <div id="gridContainer" class="pin-grid"></div>
    </main>

    <script>
        let restaurants = []; // Loaded from your Sheet
        let currentHub = 'all';
        let activeFeatures = [];

        function selectHub(hub) {
            currentHub = hub;
            activeFeatures = [];
            document.querySelectorAll('.hub-card').forEach(c => c.classList.remove('active-hub'));
            if (hub !== 'all') document.getElementById(`hub-${hub}`).classList.add('active-hub');
            
            document.getElementById('level2Section').classList.toggle('hidden', hub === 'all');
            renderDynamicTags();
            renderGrid();
        }

        function renderDynamicTags() {
            const container = document.getElementById('dynamicTags');
            container.innerHTML = '';
            
            const items = currentHub === 'all' ? restaurants : restaurants.filter(i => i.cat_l1 === currentHub);
            const tags = new Set();
            items.forEach(i => i.cat_l2 && i.cat_l2.split(',').forEach(t => tags.add(t.trim())));

            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-full text-xs font-bold border transition ${activeFeatures.includes(tag) ? 'bg-rose-500 text-white border-rose-500' : 'bg-white text-slate-600 border-slate-200'}`;
                btn.innerText = tag.toUpperCase();
                btn.onclick = () => {
                    activeFeatures.includes(tag) ? activeFeatures.splice(activeFeatures.indexOf(tag), 1) : activeFeatures.push(tag);
                    renderDynamicTags(); renderGrid();
                };
                container.appendChild(btn);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';
            const filtered = restaurants.filter(i => {
                const matchHub = (currentHub === 'all' || i.cat_l1 === currentHub);
                const matchTags = activeFeatures.length === 0 || activeFeatures.every(f => i.cat_l2 && i.cat_l2.includes(f));
                return matchHub && matchTags;
            });
            filtered.forEach(item => {
                grid.innerHTML += `<div class="pin-card bg-white p-4 rounded-2xl border">${item.name}</div>`;
            });
        }

        // Add your fetch logic here to populate 'restaurants' array
    </script>
</body>
</html>
