<!DOCTYPE html>

    <title>KL Vibe Check — Dining & Cafe Directory</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Leaflet OpenStreetMap CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .pin-grid {
            column-count: 1;
            column-gap: 1.25rem;
        }
        @media (min-width: 640px) { .pin-grid { column-count: 2; } }
        @media (min-width: 1024px) { .pin-grid { column-count: 3; } }
        @media (min-width: 1280px) { .pin-grid { column-count: 4; } }
        
        .pin-card {
            break-inside: avoid;
            margin-bottom: 1.25rem;
        }

        #mapContainer {
            height: 420px;
            width: 100%;
            border-radius: 1.5rem;
            z-index: 10;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-rose-500 selection:text-white">

    <!-- Header & Filter Navigation -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/80 px-4 lg:px-8 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center text-white shadow-md shadow-rose-500/20">
                    <i data-lucide="compass" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-slate-900">KL Vibe Check</h1>
                    <p class="text-xs text-slate-500 font-medium">Curated Kuala Lumpur Dining & Map Locator</p>
                </div>
            </div>

            <div class="w-full md:w-auto flex items-center gap-3">
                <div class="relative w-full md:w-72">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" onkeyup="filterPlaces()" placeholder="Search by name, food, area..." class="w-full pl-9 pr-4 py-2 bg-slate-100 focus:bg-white border border-transparent focus:border-rose-400 rounded-full text-sm outline-none transition">
                </div>

                <!-- View Switcher Toggle -->
                <button onclick="toggleMapView()" id="mapToggleBtn" class="flex items-center gap-1.5 bg-rose-500 text-white font-semibold px-4 py-2 rounded-full text-xs hover:bg-rose-600 transition shadow-sm whitespace-nowrap">
                    <i data-lucide="map" class="w-4 h-4"></i> Map View
                </button>
            </div>
        </div>

        <div class="max-w-7xl mx-auto mt-4 flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-sm font-semibold">
            <button onclick="setCategory('all')" class="cat-btn active bg-slate-900 text-white px-4 py-2 rounded-full whitespace-nowrap transition shadow-sm">All Vibes</button>
            <button onclick="setCategory('instagrammable')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-full border border-slate-200 whitespace-nowrap transition">📸 Instagrammable</button>
            <button onclick="setCategory('pet-friendly')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-full border border-slate-200 whitespace-nowrap transition">🐾 Pet Friendly</button>
            <button onclick="setCategory('outdoor-nature')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-full border border-slate-200 whitespace-nowrap transition">🌿 Nature & Jungle</button>
            <button onclick="setCategory('halal-aesthetic')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-full border border-slate-200 whitespace-nowrap transition">✨ Halal Fine & Casual</button>
            <button onclick="setCategory('street-night')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-full border border-slate-200 whitespace-nowrap transition">🌙 Late Night & Street</button>
            <button onclick="setCategory('speakeasy')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-full border border-slate-200 whitespace-nowrap transition">🍸 Speakeasies</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 lg:px-8 py-6">
        
        <!-- Interactive Map Section -->
        <section id="mapSection" class="mb-8 hidden">
            <div class="bg-white p-3 rounded-3xl border border-slate-200/80 shadow-md">
                <div id="mapContainer"></div>
            </div>
        </section>

        <!-- Places Grid -->
        <div id="pinContainer" class="pin-grid">
            <div class="col-span-full py-16 text-center text-slate-400">
                <p class="text-base font-medium">Loading places...</p>
            </div>
        </div>
    </main>

            "jalan sultan": [3.1428, 101.6983]
        };

        let restaurants = [];
        let currentCat = 'all';
        let map = null;
        let mapMarkers = [];
        let isMapVisible = false;

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) return [];

            function parseLine(text) {
                const result = [];
                let cur = '';
                let inQuotes = false;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(cur.trim());
                        cur = '';
                    } else {
                        cur += char;
                    }
                }
                result.push(cur.trim());
                return result;
            }

            const headers = parseLine(lines[0]).map(h => h.toLowerCase().replace(/^"|"$/g, ''));
            const items = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseLine(lines[i]).map(v => v.replace(/^"|"$/g, ''));
                let obj = {};
                headers.forEach((h, idx) => {
                    obj[h] = values[idx] || '';
                });
                if (obj.name) items.push(obj);
            }
            return items;
        }

        function initMap() {
            if (map) return;
            map = L.map('mapContainer').setView([3.1390, 101.6869], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        function updateMapMarkers(items) {
            if (!map) initMap();

            mapMarkers.forEach(marker => map.removeLayer(marker));
            mapMarkers = [];

            items.forEach(item => {
                const areaKey = (item.area || '').toLowerCase().trim();
                const coords = areaCoordinates[areaKey] || [3.1390 + (Math.random() - 0.5) * 0.05, 101.6869 + (Math.random() - 0.5) * 0.05];
                const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + item.area + ' Kuala Lumpur')}`;

                const popupContent = `
                    <div style="width: 180px; font-family: 'Plus Jakarta Sans', sans-serif;">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5'}" style="width: 100%; height: 90px; object-fit: cover; border-radius: 8px; margin-bottom: 6px;">
                        <span style="font-size: 10px; font-weight: bold; color: #E11D48; text-transform: uppercase;">${item.area || 'KL'}</span>
                        <h4 style="font-size: 13px; font-weight: bold; margin: 2px 0 4px 0; color: #0F172A;">${item.name}</h4>
                        <a href="${gmapsUrl}" target="_blank" style="display: block; text-align: center; background-color: #F43F5E; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; text-decoration: none; font-weight: bold; margin-top: 6px;">Directions ➔</a>
                    </div>
                `;

                const marker = L.marker(coords).addTo(map).bindPopup(popupContent);
                mapMarkers.push(marker);
            });
        }

        function toggleMapView() {
            const mapSec = document.getElementById('mapSection');
            const toggleBtn = document.getElementById('mapToggleBtn');

            isMapVisible = !isMapVisible;

            if (isMapVisible) {
                mapSec.classList.remove('hidden');
                toggleBtn.innerHTML = `<i data-lucide="layout-grid" class="w-4 h-4"></i> Grid View`;
                initMap();
                setTimeout(() => map.invalidateSize(), 200);
            } else {
                mapSec.classList.add('hidden');
                toggleBtn.innerHTML = `<i data-lucide="map" class="w-4 h-4"></i> Map View`;
            }
            lucide.createIcons();
        }

        async function fetchSheetData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("HTTP Error " + response.status);
                
                const csvText = await response.text();
                const fetchedItems = parseCSV(csvText);

                if (fetchedItems && fetchedItems.length > 0) {
                    restaurants = fetchedItems;
                } else {
                    restaurants = fallbackRestaurants;
                }
            } catch (err) {
                console.warn("Using fallback dataset due to fetch issue:", err);
                restaurants = fallbackRestaurants;
            }
            renderGrid();
        }

        function renderGrid() {
            const container = document.getElementById('pinContainer');
            const query = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filtered = restaurants.filter(item => {
                const matchCat = (currentCat === 'all' || item.cat === currentCat);
                const matchSearch = (item.name || '').toLowerCase().includes(query) || 
                                    (item.area || '').toLowerCase().includes(query) || 
                                    (item.desc || '').toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            updateMapMarkers(filtered);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400">
                        <i data-lucide="frown" class="w-12 h-12 mx-auto mb-3 stroke-1"></i>
                        <p class="text-lg font-medium">No dining spots found matching your search.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "pin-card group relative bg-white rounded-3xl overflow-hidden border border-slate-200/70 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1";
                
                const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + item.area + ' Kuala Lumpur')}`;

                card.innerHTML = `
                    <div class="relative overflow-hidden aspect-[4/5] bg-slate-100 cursor-pointer" onclick="window.open('${gmapsUrl}', '_blank')">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5'}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent opacity-80"></div>
                        
                        <div class="absolute top-3 left-3 flex gap-2">
                            <span class="bg-white/90 backdrop-blur-md text-slate-900 text-[11px] font-bold px-3 py-1 rounded-full shadow-sm">${item.tag || 'Food Spot'}</span>
                        </div>

                        <div class="absolute top-3 right-3">
                            <span class="bg-slate-900/60 backdrop-blur-md text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-full border border-white/10">${item.price || '$$'}</span>
                        </div>

                        <div class="absolute bottom-0 inset-x-0 p-4 text-white">
                            <p class="text-xs font-semibold text-rose-300 uppercase tracking-wider mb-0.5">${item.area || 'Kuala Lumpur'}</p>
                            <h3 class="text-lg font-bold leading-tight mb-1">${item.name || 'Unnamed Spot'}</h3>
                            <p class="text-xs text-slate-200 line-clamp-2 leading-relaxed font-normal">${item.desc || ''}</p>
                        </div>
                    </div>
                    
                    <div class="p-3 bg-white flex items-center justify-between text-slate-400 text-xs border-t border-slate-100">
                        <span class="flex items-center gap-1 font-medium text-slate-600"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-500"></i> ${item.area}</span>
                        <a href="${gmapsUrl}" target="_blank" class="flex items-center gap-1 text-rose-500 font-bold hover:underline">
                            Directions <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        function setCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'shadow-sm');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            event.target.classList.remove('bg-white', 'text-slate-600');
            event.target.classList.add('bg-slate-900', 'text-white', 'shadow-sm');
            renderGrid();
        }

        function filterPlaces() {
            renderGrid();
        }

        fetchSheetData();
    </script>
